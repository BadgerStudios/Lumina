apply plugin: 'com.android.application'

android {
    namespace = "com.luxffa.lumina"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.luxffa.lumina"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 54
        versionName "1.54"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // One stable signing identity for every Lumina APK — DEBUG BUILDS INCLUDED, because the
    // sideloaded `assembleDebug` output IS the published artifact. Before this existed, each build
    // was signed by whichever machine's auto-generated ~/.android/debug.keystore happened to run
    // gradle: five different certificates exist across published versions, installed apps refused
    // in-place updates whenever the cert changed, and Android App Links (assetlinks.json pins the
    // cert hash) verified or failed by luck. secrets/keystore.properties + the keystore it points
    // to are gitignored and MUST be backed up — losing them recreates exactly that mess. The cert's
    // SHA-256 must stay listed in apps/frontend/public/.well-known/assetlinks.json. Falls back to
    // the default debug keystore when the file is absent so a fresh checkout still builds.
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("../../../secrets/keystore.properties")
    if (keystorePropertiesFile.exists()) {
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
        signingConfigs {
            luminaShared {
                storeFile file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
        buildTypes.debug.signingConfig = signingConfigs.luminaShared
        buildTypes.release.signingConfig = signingConfigs.luminaShared
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // BiometricPrompt — the packaged apps cannot use WebAuthn passkeys (their capacitor:// origin
    // can never match the relying-party domain), so biometric unlock is done natively instead.
    implementation "androidx.biometric:biometric:1.1.0"
    // Native age assurance (AgeSignalsPlugin): Play Integrity attests the app is genuine, Play Age
    // Signals supplies the coarse age band. The backend (verification/attestation.ts) trusts the band
    // only if the Integrity token verifies. Age Signals is beta + geo-gated (Google's staged rollout
    // through end of 2026), so the band is often "unavailable" — the app then falls back to the
    // self-declared birthday, same as web.
    implementation "com.google.android.play:integrity:1.4.0"
    implementation "com.google.android.play:age-signals:0.0.4"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
