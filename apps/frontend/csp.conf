# Content-Security-Policy for the HTML documents only (the SPA and the owner console).
#
# Everything this app loads is served from its own origin: fonts are pre-subset local woff2 files,
# there is no CDN, no analytics script, no external stylesheet, and no embedded third party. That is
# what makes a policy this strict achievable rather than aspirational.
#
# Each directive below is here for a reason, and loosening one should require the same:
#
#   script-src 'self'      No inline scripts and no eval. Vite emits external bundles, so this holds
#                          as written; if it ever breaks, the fix is to stop inlining, not to add
#                          'unsafe-inline' — which would defeat the entire policy against XSS.
#   style-src  'unsafe-inline'
#                          Regrettable and currently unavoidable: 21 components set style={{...}}
#                          for values only known at runtime (progress bar widths, theme accent
#                          colours, avatar sizes). CSP3's style-src-attr falls back to style-src, so
#                          removing this needs those converted to CSS custom properties first.
#   img-src / media-src blob:
#                          URL.createObjectURL is used to preview a picked image or video before it
#                          is uploaded (RemixModal, FeedUploadModal, EmojiSettingsPanel, avatars).
#                          Without blob: those previews silently render nothing.
#   connect-src            Same origin covers /api and the Socket.IO websocket. wss: is listed
#                          explicitly because some browsers do not treat a ws upgrade as 'self'.
#   frame-ancestors 'none' The same statement as X-Frame-Options: DENY, in the form modern browsers
#                          actually honour. Both are sent; the header is for older ones.
#   object-src 'none'      No Flash/Java/embed. Nothing here uses <object>, and it is a classic
#                          bypass for script-src.
#   base-uri 'self'        Stops an injected <base> tag repointing every relative URL on the page.
#   form-action 'self'     There is no cross-origin form post; Stripe Checkout is a full navigation
#                          via location.href, which this does not restrict.
#   upgrade-insecure-requests
#                          Belt and braces behind HSTS.
#   frame-src https:       Was 'none', which silently blocked EVERY iframe — including the
#                          sandboxed Activity frames (components/game/ActivityFrame.tsx), i.e.
#                          embedded apps simply never rendered on web (found by the platform
#                          debug sweep). Activities embed developer-registered https-only URLs,
#                          so https: is the correct floor; the real isolation comes from the
#                          iframe's sandbox attribute + targeted postMessage, not from CSP.
#   static.cloudflareinsights.com
#                          Cloudflare INJECTS its Web Analytics beacon into every HTML response at
#                          the edge — the app does not reference it and cannot remove it from here.
#                          Blocking it logged two CSP violations on every single page load, and a
#                          console that always shows errors is a console nobody reads a real error
#                          out of. Allowed as a script source and a fetch target only.
#
#                          NOTE: Cloudflare also injects a small INLINE script alongside it. That
#                          one stays blocked, deliberately — allowing it needs 'unsafe-inline' on
#                          script-src, which would defeat the entire policy for the sake of an
#                          analytics beacon. The external beacon still loads and reports. If the
#                          remaining inline violation is unwanted, the fix is to turn Web Analytics
#                          off for this zone in the Cloudflare dashboard, not to weaken this.
#
# Report-only is deliberately NOT used: this policy has been verified against the live app by the
# frontend verification suite, and a report-only policy that nobody reads the reports of is just a
# header that does nothing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' wss: https://static.cloudflareinsights.com https://cloudflareinsights.com; worker-src 'self' blob:; manifest-src 'self'; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
