# Serves the built SPA and reverse-proxies API/websocket traffic to the
# backend container. `backend` only resolves inside the docker-compose
# network this image will eventually run in (future milestone) — it is
# intentionally NOT used by local dev, which instead relies on Vite's dev
# server proxy (see ../vite.config.ts) to reach 127.0.0.1:4000 directly.
# The client's real address, and the only value allowed to become one.
#
# This previously forwarded `$proxy_add_x_forwarded_for`, which APPENDS to whatever the client sent
# — so a request carrying its own `X-Forwarded-For: 203.0.113.99` arrived at the backend as
# "203.0.113.99, <real ip>", and Fastify's `trustProxy: true` takes the LEFTMOST entry. The client
# therefore chose its own IP address. Demonstrated live: a registration sent with that header
# recorded 203.0.113.99 (a reserved documentation address that cannot be a real client) as the
# session's IP.
#
# That defeated every IP-based control at once: IP-scoped platform bans, the per-IP login rate
# limit that exists to slow credential stuffing, and — worst — the upload provenance recorded
# specifically so uploads are legally attributable.
#
# The fix is to REPLACE rather than append. Cloudflare fronts this deployment and sets
# CF-Connecting-IP itself, overwriting any client-supplied copy, so it is trustworthy in a way an
# inbound X-Forwarded-For never is. Falls back to the peer address when the header is absent
# (direct-to-container requests, local dev), which is the value nginx observed itself.
map $http_cf_connecting_ip $lumina_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health must reach the BACKEND, not fall through to the SPA: before this existed,
    # https://<domain>/healthz answered 200 with index.html even with the API completely down,
    # which is a monitoring endpoint that cannot report an outage (found by the platform debug
    # sweep). Exact-match so no SPA route named /healthz* is shadowed beyond the probe itself.
    location = /healthz {
        proxy_pass http://backend:4000/healthz;
        proxy_http_version 1.1;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $lumina_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx's DEFAULT client_max_body_size is 1m, and it was never overridden here — so every
        # video upload died the instant it crossed 1MB, at the proxy, without reaching the backend
        # at all. The browser's progress bar simply stopped (a 5MB file froze at ~21%) because
        # nginx stops reading and closes rather than letting the transfer finish.
        #
        # Set well above the app's own per-route caps so the app's limit — which returns a real,
        # readable error — is always the one that trips first. A 413 from nginx is an HTML error
        # page the client cannot parse into a message. The ceiling here is the max of every route:
        # the master brand-kit upload (BRAND_KIT_MAX_BYTES = 1GB, modules/master/routes.ts) is the
        # largest, so this must stay above it — otherwise a big brand kit dies at the proxy at ~20%,
        # exactly the video bug this line originally fixed.
        client_max_body_size 1200m;

        # Stream the body straight through instead of spooling it to a temp file first. The upload
        # handler (modules/videos/storage.ts) was deliberately written to stream to disk rather
        # than buffer in memory; with request buffering on, nginx negates that by staging the whole
        # file itself, doubling the disk write and delaying the first byte reaching the backend.
        proxy_request_buffering off;

        # A 100MB upload over a phone connection legitimately takes minutes; the 60s defaults would
        # cut it off partway through.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # The standalone owner console — the same bundle the owner Android APK wraps. Its own
    # try_files root so a refresh inside the console doesn't fall through to the main SPA.
    # It grants nothing on its own: every route it calls enforces requireOwner server-side.
    location /owner-app/ {
        alias /usr/share/nginx/html/owner-app/;
        try_files $uri $uri/ /owner-app/index.html;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }

    # Serves the Android debug APK + Linux desktop AppImage (and any future build artifacts)
    # from a bind-mounted host directory (see compose.yml `./downloads`), decoupled from the
    # image build so a new build can be dropped in and served immediately without
    # rebuilding/redeploying this container.
    # Downloads are split by whether a filename can ever change meaning. That distinction, not
    # file size, is what decides where each one is served from.
    #
    # **Versioned builds go to R2.** `Lumina-1.0.7.AppImage` is immutable — that exact name will
    # never contain different bytes — so it can be cached at the edge forever. This is also where
    # essentially all the bandwidth is: every desktop client auto-updating pulls 125MB from here.
    #
    # **Stable names stay on the origin.** `lumina.apk` and `latest-linux.yml` are OVERWRITTEN on
    # every deploy, so the same URL returns different bytes over time. Serving those through a CDN
    # meant Cloudflare cached a build and kept handing it out after a new one shipped — a fix that
    # is live on the server but invisible to every client, which is the worst shape of bug. They
    # are small (8MB and 364 bytes); the origin can carry them, and correctness beats the saving.
    location ~ ^/downloads/(desktop/Lumina-[^/]+\.AppImage)$ {
        # Required because proxy_pass contains a variable ($1). That switches nginx from resolving
        # the upstream once at startup to resolving it per request, and without a resolver it fails
        # every request with "no resolver defined" rather than at config-test time. Docker's
        # embedded DNS is at 127.0.0.11 and forwards to the host's upstream resolvers.
        resolver 127.0.0.11 1.1.1.1 valid=300s;
        proxy_pass https://dl.badgerstudios.net/$1;
        proxy_set_header Host dl.badgerstudios.net;
        # The origin's own credentials must never travel to a public bucket.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        # 125MB over a slow link takes a while; the defaults would cut it off mid-update.
        proxy_read_timeout 900s;
        proxy_buffering off;
        add_header Content-Disposition "attachment";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        add_header Content-Disposition "attachment";
        # This file gets overwritten in place on every deploy (same filename, new bytes) —
        # without this, Cloudflare's edge cache (and browsers) can keep serving a stale build
        # indefinitely, silently masking whatever actually shipped (bit us: an icon/splash fix
        # sat cached at the edge while the origin already had the fix).
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        # Repeated, not inherited: this location declares add_header, which discards every
        # server-level one. No CSP — these are binary downloads, not documents.
        include /etc/nginx/snippets/security-headers.conf;
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream AppImage;
        }
        default_type application/octet-stream;
        autoindex off;
    }

    # Same reasoning across all four: plain static image roots served directly by the backend
    # (see apps/backend/src/index.ts's fastifyStatic registrations), just reverse-proxied here
    # so they ride the same origin as everything else.
    location ~ ^/(avatars|banners|server-icons|server-banners|emojis|stickers|sounds|game-skins)/ {
        proxy_pass http://backend:4000$uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Discord compatibility layer: the REST subset and the gateway websocket. Same upgrade
    # handling as /socket.io below — the gateway is a real long-lived websocket.
    location /discord/ {
        proxy_pass http://backend:4000/discord/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $lumina_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $lumina_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # nginx's bundled mime.types has no entry for .webmanifest, so it fell back to
    # application/octet-stream. Browsers vary in how much they care; Safari is among the stricter,
    # and a manifest served as a binary download is a manifest iOS may decline to honour — which
    # presents as "Add to Home Screen doesn't make it an app" with nothing in any log.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        # Overwritten on deploys like index.html, and it is what tells iOS the app's identity.
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite content-hashes every filename under /assets/ — a new build never reuses an old one's
    # name, so these are safe to cache aggressively AND safe to 404 on: `=404` rather than falling
    # through to `location /`'s SPA fallback below is what makes a missing asset fail loud. Without
    # it, a browser holding a stale index.html from a PREVIOUS deploy (this container's assets are
    # replaced wholesale on every build, old hashes just stop existing) requests a JS/CSS filename
    # that's gone, the catch-all SPA rule below quietly hands back index.html's *HTML* with a 200,
    # and the browser tries to parse that as JavaScript/CSS and fails silently — a permanently blank
    # white screen with nothing in the network tab to explain it, since every request "succeeded".
    # Live incident, not hypothetical: three redeploys in one evening left exactly one real user
    # stuck this way.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html is the one file in this image that is NOT content-hashed — its own filename never
    # changes even though a new build changes what asset paths it points to. Without an explicit
    # no-cache here, a browser (or Cloudflare, which fronts this deployment — see the top of this
    # file) can hold onto an old index.html and keep resolving it against assets a later deploy has
    # since deleted, which is the other half of the white-screen bug fixed by the /assets/ rule
    # above: even a hard 404 on the missing asset doesn't help if the page never re-fetches a
    # correct index.html to begin with.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }

    # Marketing media: the screenshots and the nebula backdrop loop under /screens/.
    #
    # Without this block these fall through to `location /` below and inherit its
    # `no-store, must-revalidate` — which is correct for index.html and catastrophic for a
    # multi-megabyte background video: every single page load would re-download the whole loop,
    # for every visitor, forever. These files are static build artefacts that only change when
    # someone deliberately regenerates them, so they cache for 30 days; bust by renaming the file
    # (there is no content hash in these names, which is exactly why this is max-age and not
    # `immutable`).
    #
    # =404 rather than falling through to the SPA rule, for the same reason /assets/ does it: a
    # missing video should fail as a missing video, not silently return index.html's HTML with a
    # 200 and leave a <video> element trying to decode a web page.
    location /screens/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Android App Links verification. Android fetches this over HTTPS and will only accept it as
    # application/json -- without its own location it falls through to the SPA rule below, gets
    # index.html, and verification fails with an error that says nothing about why. Explicitly
    # =404 rather than falling back, for the same reason.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
    }
}
