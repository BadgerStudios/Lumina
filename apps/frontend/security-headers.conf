# Security headers for everything nginx serves itself.
#
# ## Why this is a separate file that gets `include`d rather than one block in the server{}
#
# nginx's `add_header` is NOT inherited into a `location` that declares any `add_header` of its own
# — the child's list replaces the parent's entirely. `/downloads/` sets Content-Disposition and
# Cache-Control, so a server-level declaration would have silently applied everywhere EXCEPT there.
# That is precisely the kind of hole that looks fixed in a config review and isn't. Including the
# same file in each location makes the repetition explicit and impossible to half-apply.
#
# ## Why not on /api/ or /socket.io/
#
# The backend already sets all of these via @fastify/helmet (see plugins/helmet.ts). Adding them
# here too would emit each header twice, and duplicated CSP headers are intersected by browsers —
# so a second, differently-worded policy silently tightens the API's own until something breaks in
# a way no single config file explains.

# The site is HTTPS-only behind Cloudflare and there is no HTTP listener to fall back to. Two years,
# subdomains included. Deliberately NOT `preload`: that is effectively irreversible (removal from
# the browser-baked list takes months), and it should be a decision made on purpose, not inherited
# from a config template.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# The app was framable by anyone. A login form in a hidden iframe over an attacker's page is the
# entire clickjacking attack, and this app has Ban, role-grant and payment controls behind it.
# DENY rather than SAMEORIGIN: nothing here is ever legitimately framed, including by itself.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;

# strict-origin-when-cross-origin, not no-referrer: same-origin navigation still needs the referrer
# for the app's own analytics, while an external link leaks only the origin, never the path — and
# paths here contain server, channel and video ids.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Camera and microphone stay allowed for self: voice and video calls need them. Everything else the
# app never asks for is switched off, so a compromised dependency cannot start asking.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
